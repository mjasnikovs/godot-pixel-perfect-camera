name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          VERSION=4.7.2
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Format
        working-directory: godot
        run: gdformat --check scripts/ tests/

      - name: Lint
        working-directory: godot
        run: gdlint scripts/ tests/

      - name: Import assets
        working-directory: godot
        run: godot --headless --import

      - name: Compile with warnings as errors
        working-directory: godot
        run: |
          # All 49 warnings are errors in project.godot. This only parses what the
          # main scene reaches; the self-test below loads every script.
          output=$(godot --headless --quit-after 120 2>&1 | grep -v '^Godot Engine' || true)
          if [ -n "$output" ]; then
            echo "$output"
            exit 1
          fi
          echo "clean"

      - name: Run the self-test
        working-directory: godot
        run: |
          # Silent and exit 0 is a pass. A verify.gd that fails to parse still exits
          # 0, but it prints the parse error, so any output fails the step.
          status=0
          output=$(godot --headless tests/verify.tscn --quit-after 400 2>&1) || status=$?
          output=$(echo "$output" | grep -v '^Godot Engine' || true)
          if [ -n "$output" ] || [ "$status" != 0 ]; then
            echo "$output"
            exit 1
          fi

      - name: Check the followed sprite's stepping
        working-directory: godot
        run: |
          status=0
          output=$(godot --headless tests/motion.tscn 2>&1) || status=$?
          output=$(echo "$output" | grep -v '^Godot Engine' || true)
          if [ -n "$output" ] || [ "$status" != 0 ]; then
            echo "$output"
            exit 1
          fi
